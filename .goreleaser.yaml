version: 2

# The origin remote points at a private Gitea; releases always go to GitHub.
release:
  github:
    owner: MY-Final
    name: portWatch

before:
  hooks:
    - go mod tidy

builds:
  - id: portwatch
    main: ./cmd/portwatch
    binary: portwatch
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos: [windows, linux, darwin]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt
